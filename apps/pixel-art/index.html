<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>픽셀 아트 에디터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">픽셀 아트 에디터</h1>
      <p class="app__subtitle">16×16 격자에 도트를 찍어 그림을 그리고 PNG로 저장하세요.</p>
      <p class="app__subtitle">마우스·터치로 칠하거나, 키보드로도 그릴 수 있습니다: 격자에선 방향키로 이동·Enter/Space로 칠하기. 팔레트에서 Enter로 색을 고른 뒤 ↑키를 누르면 격자로 돌아갑니다.</p>
    </header>

    <section class="board" aria-label="그리기 영역">
      <div id="grid" class="grid" role="grid" aria-label="16 x 16 픽셀 격자"></div>
    </section>

    <section class="controls" aria-label="도구 및 팔레트">
      <div class="palette" id="palette" role="group" aria-label="색상 팔레트"></div>

      <div class="row">
        <label class="control control--color">
          <span>커스텀 색</span>
          <input type="color" id="colorPicker" value="#ff4d4d" aria-label="커스텀 색 선택">
        </label>
        <div class="current" aria-live="polite">
          <span>현재 색</span>
          <span class="current__swatch" id="currentSwatch" aria-hidden="true"></span>
          <span class="sr-only" id="currentColorText"></span>
        </div>
      </div>

      <div class="row row--tools">
        <button type="button" class="btn" id="eraserBtn" aria-pressed="false">지우개</button>
        <button type="button" class="btn" id="clearBtn">전체 지우기</button>
        <button type="button" class="btn btn--primary" id="saveBtn">PNG 저장</button>
      </div>
    </section>
  </main>

  <canvas id="exportCanvas" width="320" height="320" class="offscreen" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
