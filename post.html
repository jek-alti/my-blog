<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 — MyBlog using Claude</title>

    <!-- FOUC 방지: 저장된 테마를 첫 페인트 전에 적용 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved ||
            (window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="css/style.css" />

    <!-- 마크다운 파싱(marked) + XSS 정화(DOMPurify): CDN(jsDelivr), 버전 고정 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title"><a href="index.html">MyBlog using Claude</a></h1>
      <button
        type="button"
        class="theme-toggle"
        aria-label="테마 전환"
        title="테마 전환"
      >
        <span class="icon-light" aria-hidden="true">🌙</span>
        <span class="icon-dark" aria-hidden="true">☀️</span>
      </button>
    </header>

    <main class="site-main">
      <a class="back-link" href="index.html">← 목록으로</a>

      <p id="article-status" class="status">글을 불러오는 중…</p>

      <article id="article" class="article-card" hidden>
        <header class="article-header">
          <h1 id="article-title"></h1>
          <p id="article-meta" class="post-meta"></p>
        </header>
        <div id="article-body" class="article-body"></div>
      </article>
    </main>

    <footer class="site-footer">
      <p>© 2026 MyBlog using Claude · 마크다운으로 만든 정적 블로그</p>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/post.js"></script>
  </body>
</html>
