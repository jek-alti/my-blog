name: PR Checks

on:
  pull_request:
    branches: ["main"]

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install html-validate
        run: npm install --no-save html-validate
      - name: Validate HTML files
        run: npx html-validate "*.html" "apps/**/*.html" "posts/**/*.html"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            './**/*.html'
          fail: true

  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify apps/ self-contained structure
        run: bash .github/scripts/check-apps-structure.sh

  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package site as preview artifact
        run: zip -r site-preview.zip . -x ".git/*"
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-preview
          path: site-preview.zip
          retention-days: 7
